    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           SECTION 1: CSS — Complete Styles
           ================================================================ */
        :root {
            --bg: #EEF1F7;
            --surface: #FFFFFF;
            --surface-muted: #F3F4F6;
            --surface-muted-2: #F9FAFB;
            --border: #E5E7EB;
            --border-strong: #D8DBE0;
            --text: #111214;
            --text-muted: #6B7280;
            --text-faint: #9CA3AF;
            --black: #0C0C10;
            --black-2: #1A1B1F;
            --orange: #F97316;
            --orange-bg: #FFF4E8;
            --red: #DC2626;
            --red-bg: #FDECEC;
            --blue: #4A5FE8;
            --blue-dark: #3B4CD1;
            --green: #16A34A;
            --green-bg: #E4F3EC;
            --purple: #7C3AED;
            --purple-bg: #EDE9FE;
            --font-display: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 18px;
            --radius-pill: 999px;
            --shadow-sm: 0 1px 2px rgba(17,18,20,.05);
            --shadow: 0 4px 18px rgba(17,18,20,.08);
            --shadow-lg: 0 24px 60px rgba(17,18,20,.22);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
        h1, h2, h3 { font-family: var(--font-display); margin: 0; }
        button, input, select, textarea { font-family: inherit; }
        button { cursor: pointer; border: none; background: none; }
        :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
        .hidden { display: none !important; }
        #root { min-height: 100%; display: flex; flex-direction: column; }
        .mono { font-variant-numeric: tabular-nums; }
        
        .btn { display: inline-flex; align-items: center; gap: 8px; justify-content: center; padding: 10px 18px; border-radius: var(--radius-sm); border: 1.5px solid transparent; font-weight: 600; font-size: 14px; white-space: nowrap; transition: all .15s; }
        .btn:active { transform: scale(.97); }
        .btn-black { background: var(--black); color: #fff; }
        .btn-black:hover { background: var(--black-2); }
        .btn-outline { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
        .btn-outline:hover { border-color: var(--text-faint); }
        .btn-danger { background: var(--surface); color: var(--red); border-color: #F3C6C2; }
        .btn-danger:hover { background: var(--red-bg); }
        .btn-success { background: var(--green); color: #fff; }
        .btn-success:hover { background: #13803E; }
        .btn-sm { padding: 7px 12px; font-size: 13px; }
        .btn-block { width: 100%; }
        .btn[disabled] { opacity: .45; pointer-events: none; }
        
        .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 700; }
        .badge-role { background: var(--black); color: #fff; text-transform: capitalize; }
        .badge-count { background: var(--black); color: #fff; }
        .badge-muted { background: var(--surface-muted); color: var(--text-muted); border: 1px solid var(--border); }
        .badge-low { background: var(--orange-bg); color: var(--orange); }
        .badge-red { background: var(--red-bg); color: var(--red); }
        .badge-green { background: var(--green-bg); color: var(--green); }
        .badge-blue { background: #DBEAFE; color: #1D4ED8; }
        .badge-purple { background: var(--purple-bg); color: var(--purple); }
        .badge-pending { background: #FEF3C7; color: #B45309; }
        .badge-held { background: #DBEAFE; color: #1D4ED8; }
        .badge-cancelled { background: var(--red-bg); color: var(--red); }
        
        label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .field-required { color: var(--red); font-size: 14px; margin-left: 2px; }
        input[type=text], input[type=password], input[type=number], input[type=date], input[type=tel], input[type=email], select, textarea {
            width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface-muted-2); font-size: 14px; color: var(--text);
            transition: border-color .15s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--black); background: var(--surface); outline: none; box-shadow: 0 0 0 4px rgba(12,12,16,.06); }
        textarea { resize: vertical; min-height: 70px; }
        .field { margin-bottom: 14px; }
        .field-label { display: flex; align-items: center; justify-content: space-between; }
        .avatar-upload { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
        .avatar-preview { width: 64px; height: 64px; border-radius: 50%; background: var(--surface-muted); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; color: var(--text-faint); }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-preview-lg { width: 80px; height: 80px; }
        .avatar-preview-sm { width: 32px; height: 32px; }
        
        .toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
        .toast { background: var(--black); color: #fff; padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); animation: toastIn .2s ease; pointer-events: auto; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .toast-success { background: var(--green); }
        .toast-error { background: var(--red); }
        
        .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 20% 15%, #F4F6FB 0%, transparent 45%), radial-gradient(circle at 85% 85%, #EAEEF9 0%, transparent 45%), var(--bg); padding: 20px; }
        .auth-card { width: 100%; max-width: 440px; background: var(--surface); padding: 44px 38px; border-radius: 20px; box-shadow: var(--shadow-lg); text-align: center; }
        .auth-logo { width: 70px; height: 70px; border-radius: 50%; background: var(--surface-muted); display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; overflow: hidden; border: 2px solid var(--border); }
        .auth-logo img { width: 100%; height: 100%; object-fit: cover; }
        .auth-card h1 { font-size: 26px; margin-bottom: 6px; }
        .auth-sub { color: var(--text-muted); font-size: 14.5px; margin-bottom: 30px; }
        .auth-toggle { display: flex; gap: 8px; margin-bottom: 18px; background: var(--surface-muted); padding: 4px; border-radius: var(--radius-sm); }
        .auth-toggle button { flex: 1; padding: 10px 8px; border: none; border-radius: var(--radius-sm); background: transparent; font-weight: 700; font-size: 13px; text-transform: uppercase; color: var(--text-muted); transition: all .15s; }
        .auth-toggle button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
        .auth-error { color: var(--red); font-size: 13px; margin: -6px 0 14px; text-align: left; min-height: 16px; }
        .auth-hint { font-size: 11px; color: var(--text-faint); margin-top: 16px; line-height: 1.5; }
        .auth-social { display: flex; justify-content: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
        .auth-social a { color: var(--text-muted); transition: color .15s; }
        .auth-social a:hover { color: var(--text); }
        
        .app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); background: rgba(255,255,255,.92); }
        .brand { display: flex; align-items: center; gap: 12px; background: transparent; border: none; padding: 4px 10px 4px 4px; border-radius: var(--radius-sm); transition: all .15s; }
        .brand:hover { background: var(--surface-muted); }
        .brand-logo { width: 38px; height: 38px; border-radius: var(--radius-sm); background: var(--surface-muted); display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; border: 1px solid var(--border); }
        .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
        .brand h1 { font-size: 19px; letter-spacing: -0.01em; }
        .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .user-chip { display: flex; align-items: center; gap: 9px; background: transparent; border: none; padding: 4px 10px; border-radius: var(--radius-sm); transition: all .15s; }
        .user-chip:hover { background: var(--surface-muted); }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-muted); border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--text-faint); }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-chip .name { font-size: 13.5px; font-weight: 600; }
        .install-btn { display: none; }
        
        .tabbar-wrap { padding: 14px 24px 0; max-width: 1180px; margin: 0 auto; width: 100%; }
        .tabbar { display: flex; gap: 2px; background: var(--surface-muted); padding: 5px; border-radius: var(--radius-pill); overflow-x: auto; flex-wrap: nowrap; }
        .tabbar button { background: transparent; border: none; color: var(--text-muted); padding: 10px 20px; border-radius: var(--radius-pill); font-weight: 600; font-size: 13.5px; white-space: nowrap; display: flex; align-items: center; gap: 7px; flex-shrink: 0; transition: all .15s; }
        .tabbar button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
        .tabbar button:hover:not(.active) { color: var(--text); }
        
        main { flex: 1; max-width: 1180px; width: 100%; margin: 0 auto; padding: 22px 24px 90px; }
        .view { animation: fadeIn .2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .view-head { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .view-head h2 { font-size: 24px; }
        .view-head p { margin: 4px 0 0; color: var(--text-muted); font-size: 14px; }
        .view-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; transition: all .15s; }
        .stat-card:hover { box-shadow: var(--shadow); }
        .stat-card .row { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); }
        .stat-card .row span { font-size: 13.5px; font-weight: 600; color: var(--text); }
        .stat-card .val { font-size: 26px; font-weight: 700; margin-top: 14px; font-family: var(--font-display); }
        .stat-card .sub { font-size: 12.5px; color: var(--text-faint); margin-top: 3px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media(max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
        .panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .panel-head h3 { font-size: 14.5px; }
        .panel-sub { font-size: 12.5px; color: var(--text-muted); margin: 2px 0 14px 26px; }
        .list-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--surface-muted); }
        .list-row:last-child { border-bottom: none; }
        .list-row .l-name { font-weight: 600; font-size: 13.5px; }
        .list-row .l-sub { font-size: 11.5px; color: var(--text-muted); }
        .list-row .l-val { font-weight: 700; font-size: 13px; }
        .empty { padding: 40px 10px; text-align: center; color: var(--text-faint); font-size: 13.5px; }
        .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
        
        .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
        .toolbar .search-wrap { flex: 1; min-width: 220px; position: relative; }
        .toolbar .search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
        .toolbar .search-wrap input { padding-left: 38px; }
        .toolbar select { width: auto; min-width: 160px; }
        .toggle-btn { background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; color: var(--text); transition: all .15s; }
        .toggle-btn.active { background: var(--orange-bg); border-color: #F6D3AE; color: var(--orange); }
        .toggle-btn:hover { border-color: var(--text-muted); }
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
        .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; transition: all .15s; }
        .item-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
        .item-card .ic-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .item-card .ic-name { font-weight: 700; font-size: 15px; line-height: 1.3; }
        .item-card .ic-cat { background: var(--surface-muted); border: 1px solid var(--border); font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: var(--radius-pill); white-space: nowrap; color: var(--text-muted); }
        .item-card .ic-sku { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
        .item-card .ic-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--text-muted); }
        .item-card .ic-row b { color: var(--text); font-weight: 700; }
        .item-card .ic-desc { font-size: 12px; color: var(--text-faint); margin-top: 10px; font-style: italic; }
        .item-card .ic-actions { display: flex; gap: 8px; margin-top: 14px; }
        .item-card .ic-actions .btn { flex: 1; }
        .item-card .ic-image { width: 100%; height: 120px; border-radius: var(--radius-sm); object-fit: cover; background: var(--surface-muted); margin-bottom: 10px; }
        
        .client-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; transition: all .15s; }
        .client-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
        .client-card .cc-top { display: flex; align-items: flex-start; justify-content: space-between; }
        .client-card .cc-name { font-weight: 700; font-size: 15.5px; }
        .client-card .cc-since { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
        .client-card .cc-line { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text-muted); margin-top: 10px; }
        .client-card .cc-purchases { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--surface-muted); margin-top: 14px; padding-top: 12px; font-size: 13px; }
        .client-card .cc-purchases b { font-family: var(--font-display); font-size: 14.5px; }
        
        .sale-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; transition: all .15s; }
        .sale-row:hover { box-shadow: var(--shadow-sm); }
        .sale-row .sr-client { font-weight: 700; font-size: 14px; }
        .sale-row .sr-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
        .sale-row .sr-total { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
        .sale-row .sr-status { padding: 4px 12px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; }
        .sr-status.completed { background: var(--green-bg); color: var(--green); }
        .sr-status.pending { background: #FEF3C7; color: #B45309; }
        .sr-status.held { background: #DBEAFE; color: #1D4ED8; }
        .sr-status.cancelled { background: var(--red-bg); color: var(--red); }
        
        .pos-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
        @media(max-width: 760px) { .pos-grid { grid-template-columns: 1fr; } }
        .product-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
        .pick-card { background: var(--surface-muted-2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px; text-align: left; transition: all .15s; }
        .pick-card:hover:not(:disabled) { border-color: var(--black); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
        .pick-card:disabled { opacity: 0.4; cursor: not-allowed; }
        .pick-card .pn { font-weight: 700; font-size: 12.5px; line-height: 1.3; }
        .pick-card .pp { font-weight: 700; color: var(--black); font-size: 13px; margin-top: 6px; }
        .pick-card .ps { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
        .pick-card .pi { width: 100%; height: 80px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 6px; background: var(--surface-muted); }
        .cart-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--surface-muted); }
        .cart-item .ci-name { flex: 1; font-size: 12.5px; font-weight: 600; }
        .cart-item input { width: 50px; text-align: center; padding: 6px; }
        .cart-total { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; font-family: var(--font-display); font-size: 19px; font-weight: 700; border-top: 2px solid var(--black); margin-top: 6px; }
        
        .sale-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .sale-actions .btn { flex: 1; min-width: 80px; }
        
        .overlay { position: fixed; inset: 0; background: rgba(12,12,16,.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; backdrop-filter: blur(4px); animation: overlayIn .2s ease; }
        @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 480px; padding: 26px; max-height: 88vh; overflow: auto; box-shadow: var(--shadow-lg); animation: modalIn .2s ease; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal h3 { font-size: 17px; margin-bottom: 18px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .modal-actions .btn { flex: 1; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-wide { max-width: 760px; }
        
        .ai-fab { position: fixed; bottom: 22px; right: 22px; width: 54px; height: 54px; border-radius: 50%; background: var(--blue); color: #fff; border: none; box-shadow: var(--shadow-lg); z-index: 900; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: all .2s; }
        .ai-fab:hover { background: var(--blue-dark); transform: scale(1.05); }
        .ai-panel { position: fixed; bottom: 86px; right: 22px; width: 330px; max-width: calc(100vw - 32px); background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); z-index: 900; display: flex; flex-direction: column; max-height: 68vh; overflow: hidden; border: 1px solid var(--border); animation: modalIn .2s ease; }
        .ai-head { background: var(--black); color: #fff; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .ai-head b { font-size: 13.5px; }
        .ai-head button { background: transparent; border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 4px; }
        .ai-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .ai-msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; font-size: 13px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
        .ai-msg.bot { background: var(--surface-muted); align-self: flex-start; border-bottom-left-radius: 3px; }
        .ai-msg.user { background: var(--blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
        .ai-foot { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); flex-shrink: 0; }

        let state = null;
        let session = null;

        function loadState() {
            const raw = localStorage.getItem(STORE_KEY);
            if (!raw) {
                state = seedData();
                localStorage.setItem(STORE_KEY, JSON.stringify(state));
            } else {
                state = JSON.parse(raw);
            }
            const syncRaw = localStorage.getItem(SYNC_KEY);
            syncQueue = syncRaw ? JSON.parse(syncRaw) : [];
            updateFavicon();
            return state;
        }

        function persist() {
            localStorage.setItem(STORE_KEY, JSON.stringify(state));
            updateFavicon();
        }

        function updateFavicon() {
            const icon = state.appLogo || state.storeLogo;
            if (icon) {
                const link = document.querySelector('link[rel="icon"]');
                if (link) link.href = icon;
                const apple = document.querySelector('link[rel="apple-touch-icon"]');
                if (apple) apple.href = icon;
            }
        }

        function persistSync() { localStorage.setItem(SYNC_KEY, JSON.stringify(syncQueue)); }

        function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); }

        function now() { return new Date().toISOString(); }

        function find(table, filter) {
            let records = state[table] || [];
            if (filter) records = records.filter(filter);
            return records;
        }

        function findById(table, id) {
            return (state[table] || []).find(r => r.id === id) || null;
        }

        function insert(table, record) {
            if (!state[table]) state[table] = [];
            record.id = record.id || genId();
            record.createdAt = record.createdAt || now();
            record.updatedAt = record.updatedAt || now();
            state[table].push(record);
            persist();
            queueForSync('insert', table, record);
            return record;
        }

        function update(table, id, updates) {
            const index = (state[table] || []).findIndex(r => r.id === id);
            if (index === -1) return null;
            state[table][index] = { ...state[table][index], ...updates, updatedAt: now() };
            persist();
            queueForSync('update', table, { id, updates });
            return state[table][index];
        }

        function del(table, id) {
            if (!state[table]) return false;
            const deleted = state[table].find(r => r.id === id);
            state[table] = state[table].filter(r => r.id !== id);
            persist();
            if (deleted) { queueForSync('delete', table, { id, data: deleted }); }
            return true;
        }

        function byShop(table, shopId) {
            if (shopId === 'ALL' || shopId === 'all') { return state[table] || []; }
            return find(table, r => r.shopId === shopId);
        }

        function queueForSync(action, table, data) {
            syncQueue.push({ id: genId(), action, table, data, timestamp: Date.now(), synced: false });
            persistSync();
            if (navigator.onLine) { syncNow(); }
        }

        function syncNow() {
            if (!navigator.onLine) { console.log('🔄 Offline: Sync will happen when back online'); return; }
            if (syncQueue.length === 0) return;
            const unsynced = syncQueue.filter(item => !item.synced);
            unsynced.forEach(item => { item.synced = true;
                item.syncedAt = Date.now(); });
            persistSync();
            const cutoff = Date.now() - 86400000;
            syncQueue = syncQueue.filter(item => !item.synced || item.syncedAt > cutoff);
            persistSync();
            toast('🔄 All data synced successfully!');
        }

        window.addEventListener('online', function() { toast('🔄 Back online! Syncing changes...');
            syncNow(); });
        window.addEventListener('offline', function() { toast('📡 You are offline. Changes will sync when back online.'); });

        function getSession() {
            if (session) return session;
            try { session = JSON.parse(localStorage.getItem('rork_session')); return session; } catch { return null; }
        }

        function setSession(data) { session = data;
            localStorage.setItem('rork_session', JSON.stringify(data)); }

        function clearSession() { session = null;
            localStorage.removeItem('rork_session'); }

        function getEffectiveShopId() {
            const s = getSession();
            if (!s) return null;
            if (s.role === 'super_admin' && s.viewingShopId) { return s.viewingShopId; }
            return s.shopId;
        }

        function isSuperAdmin() { const s = getSession(); return s && s.role === 'super_admin'; }

        function isOwner() { const s = getSession(); return s && s.role === 'owner'; }

        function hasPermission(permission) {
            const s = getSession();
            if (!s) return false;
            if (s.role === 'owner' || s.role === 'super_admin') return true;
            return (s.permissions || []).includes(permission) || (s.permissions || []).includes('all');
        }

        function getShopId() {
            const s = getSession();
            if (!s) return null;
            if (s.role === 'super_admin') {
                if (s.viewingShopId) return s.viewingShopId;
                return 'ALL';
            }
            return s.shopId;
        }

        function getCurrentShop() {
            const id = getShopId();
            if (id === 'ALL' || !id) return null;
            return state.shops.find(s => s.id === id);
        }

        function getShopName(shopId) {
            const shop = state.shops.find(s => s.id === shopId);
            return shop ? shop.name : 'Unknown';
        }

        function logActivity(userId, shopId, action, details) {
            state.activityLogs.unshift({
                id: genId(),
                shopId: shopId || null,
                userId: userId,
                action: action,
                details: details,
                timestamp: Date.now(),
                ip: ''
            });
            state.activityLogs = state.activityLogs.slice(0, 500);
            persist();
        }

        // ================================================================
        // SECTION 5: REGISTRATION & LOGIN
        // ================================================================
        function registerShop(shopData) {
            const { shopName, ownerName, adminContact, username, password, avatar } = shopData;
            if (state.shops.find(s => s.name.toLowerCase() === shopName.toLowerCase())) {
                return { success: false, error: 'Shop name already exists' };
            }
            if (state.users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
                return { success: false, error: 'That username is already taken' };
            }
            const shop = { id: genId(), name: shopName, ownerName: ownerName, adminContact: adminContact, status: 'active',
                createdAt: Date.now() };
            state.shops.push(shop);
            const user = { id: genId(), shopId: shop.id, username: username.toLowerCase(), name: ownerName,
                password: password, role: 'owner', phone: adminContact, avatar: avatar || null, createdAt: Date.now() };
            state.users.push(user);
            const employee = { id: genId(), shopId: shop.id, userId: user.id, name: ownerName, role: 'owner',
                permissions: ['all'], phone: adminContact, email: '', username: username.toLowerCase(),
                avatar: avatar || null, createdAt: Date.now(), updatedAt: Date.now() };
            state.employees.push(employee);
            state.clients.push({ id: genId(), shopId: shop.id, name: 'Walk-in Customer', email: '', phone: '-',
                location: '-', joined: new Date().toLocaleDateString('en-GB'), totalPurchases: 0, createdAt: Date.now(),

            state.settings.push({ id: genId(), shopId: shop.id, currency: 'UGX', taxRate: 0,
                receiptFooter: 'Thank you for shopping with us!', createdAt: Date.now(), updatedAt: Date.now() });
            persist();
            logActivity(user.id, shop.id, 'register', `Shop "${shopName}" registered by ${ownerName}`);
            return { success: true, shop, user };
        }

        function login(shopName, username, password) {
            // SUPER ADMIN CHECK
            const superUser = state.users.find(u => u.username === username && u.password === password && u.role ===
                'super_admin');
            if (superUser) {
                const sessionData = { userId: superUser.id, shopId: 'ALL', username: superUser.name, role: 'super_admin',
                    isSuperAdmin: true, name: superUser.name };
                setSession(sessionData);
                logActivity(superUser.id, 'ALL', 'login', `Super Admin ${superUser.name} logged in`);
                return { success: true, session: sessionData, isSuperAdmin: true };
            }

            // REGULAR USER
            const shop = state.shops.find(s => s.name.toLowerCase() === shopName.trim().toLowerCase());
            if (!shop) { return { success: false, error: 'Shop not found. Check the shop name.' }; }
            const user = state.users.find(u => u.shopId === shop.id && u.username.toLowerCase() === username.trim()

        function fmt(n) {

        function timeAgo(ts) {
            const s = Math.floor((Date.now() - ts) / 1000);
            if (s < 60) return 'just now';
            if (s < 3600) return Math.floor(s / 60) + 'm ago';
            if (s < 86400) return Math.floor(s / 3600) + 'h ago';
            if (s < 604800) return Math.floor(s / 86400) + 'd ago';
            return Math.floor(s / 604800) + 'w ago';
        }

        function toast(msg, type) {
            const wrap = document.getElementById('toastWrap');
            const el = document.createElement('div');
            el.className = 'toast' + (type ? ' toast-' + type : '');
            el.textContent = msg;
            wrap.appendChild(el);
            setTimeout(() => el.remove(), 2600);
        }

        function handleImageUpload(inputId, previewId, stateKey, callback) {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            if (!input || !preview) return;
            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 500 * 1024) { toast('Image too large! Max 500KB'); return; }
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const imageData = ev.target.result;
                    preview.innerHTML = `<img src="${imageData}">`;
                    preview.dataset.url = imageData;
                    if (stateKey) state[stateKey] = imageData;
                    if (callback) callback(imageData);
                    persist();
                    toast('Image uploaded successfully!');
                };
                reader.readAsDataURL(file);
            });
        }

        function aiAnswer(q) {
            const query = q.toLowerCase();
            const shopId = getShopId();
            if (!shopId) return 'Please login to access store data.';
            const products = byShop('products', shopId);
            const clients = byShop('clients', shopId);
            const sales = byShop('sales', shopId);
            const suppliers = byShop('suppliers', shopId);
            const expenses = byShop('expenses', shopId);
            const purchases = byShop('purchases', shopId);

            if (/^(hi|hello|hey|good morning|good afternoon)/i.test(q)) {
                return `👋 Hello! I'm your Rork Power AI assistant.\n\nI can help you with:\n• 📦 Inventory & stock\n• 💰 Pricing & products\n• 👥 Clients & customers\n• 📊 Sales & revenue\n• 🏭 Suppliers & purchases\n• 💵 Expenses & reports\n\nTry asking: "How much cement do we have?" or "Show me today's sales"`;
            }
            if (/thank|thanks/i.test(q)) return "🙌 You're welcome! Anything else I can help with?";
            if (/help|\?|what can you do/i.test(q)) {
                return `🤖 **I can help with these questions:**\n\n📦 **Inventory**\n• "How many products do we have?"\n• "Show me {product}"\n• "What's running low?"\n\n💰 **Pricing**\n• "What's the price of {product}?"\n• "Most expensive item"\n\n👥 **Clients**\n• "Who are our top clients?"\n• "Show me {client}"\n\n📊 **Sales**\n• "Today's revenue"\n• "Recent sales"\n\n🏭 **Suppliers**\n• "List all suppliers"\n• "Show me {supplier}"\n\n📈 **Reports**\n• "Business report"`;
            }

            for (const product of products) {
                if (q.includes(product.name.toLowerCase().split(' ')[0].toLowerCase()) || q.includes((product.sku ||
                    '').toLowerCase())) {
                    return `📦 **${product.name}**\n• Stock: ${product.stock} ${product.unit}\n• Price: ${fmt(product.price)}\n• Cost: ${fmt(product.cost || 0)}\n• Category: ${product.category}\n• SKU: ${product.sku}\n• Reorder at: ${product.reorder} ${product.unit}`;
                }
            }

            if (q.includes('inventory') || q.includes('total products') || q.includes('how many products')) {
                const totalStock = products.reduce((s, p) => s + p.stock, 0);
                const lowStock = products.filter(p => p.stock <= p.reorder);
                const value = products.reduce((s, p) => s + (p.price * p.stock), 0);
                return `📦 **Inventory Summary**\n• ${products.length} product types\n• ${totalStock} total units\n• ${fmt(value)} total value\n• ${lowStock.length} items need reordering`;
            }

            if (q.includes('low stock') || q.includes('reorder') || q.includes('running low')) {
                const low = products.filter(p => p.stock <= p.reorder);
                if (low.length === 0) return "✅ All products are well stocked!";
                return `⚠️ **Low Stock Items** (${low.length})\n${low.map(p => `• ${p.name}: ${p.stock} ${p.unit} left (reorder at ${p.reorder})`).join('\n')}`;
            }

            if (q.includes('today') && (q.includes('sales') || q.includes('revenue'))) {
                const today = new Date().toISOString().split('T')[0];
                const todaySales = sales.filter(s => s.date && s.date.startsWith(today));
                const revenue = todaySales.reduce((sum, s) => sum + s.total, 0);
                return `📊 **Today's Sales**\n• ${todaySales.length} transaction(s)\n• Revenue: ${fmt(revenue)}`;
            }

            if (q.includes('total revenue') || q.includes('all sales')) {
                const total = sales.reduce((sum, s) => sum + s.total, 0);
                return `💰 **Total Revenue: ${fmt(total)}**\nFrom ${sales.length} transactions`;
            }

            if (q.includes('recent sales')) {
                const recent = sales.sort((a, b) => (b.date || 0) - (a.date || 0)).slice(0, 5);
                if (recent.length === 0) return "No sales recorded yet.";
                return `📋 **Recent Sales**\n${recent.map(s => `• ${s.clientName || 'Walk-in'} — ${fmt(s.total)}`).join('\n')}`;
            }

            if (q.includes('top clients') || q.includes('best clients')) {
                const clientSales = {};
                clients.forEach(c => {
                    clientSales[c.id] = sales.filter(s => s.clientId === c.id).reduce((sum, s) => sum + s
                    .total, 0);
                });
                const sorted = Object.entries(clientSales).sort((a, b) => b[1] - a[1]).slice(0, 5);
                const named = sorted.map(([id, total]) => {
                    const client = clients.find(c => c.id === id);
                    return { name: client ? client.name : 'Unknown', total };
                }).filter(c => c.total > 0);
                if (named.length === 0) return "No client purchases recorded yet.";
                return `🏆 **Top Clients**\n${named.map((c, i) => `${i+1}. ${c.name} — ${fmt(c.total)}`).join('\n')}`;
            }

            for (const client of clients) {
                if (q.includes(client.name.toLowerCase().split(' ')[0].toLowerCase())) {
                    const clientSales = sales.filter(s => s.clientId === client.id);
                    const total = clientSales.reduce((sum, s) => sum + s.total, 0);
                    return `👤 **${client.name}**\n📞 ${client.phone}\n📍 ${client.location || 'N/A'}\n📦 ${clientSales.length} purchases\n💰 Total spent: ${fmt(total)}`;
                }
            }

            if (/employee|staff|team member|worker|cashier|who works/i.test(q)) {
                const employees = EMPLOYEES.getAll();
                if (employees.length === 0) return "👤 No employee accounts yet. Add staff from the Employees tab.";
                return `👥 **Team (${employees.length})**\n${employees.map(e => `• ${e.name} — ${e.role} — ${e.phone || 'no phone'}`).join('\n')}`;
            }

            if (/store key|my store|shop name|admin contact|about (my|the) shop/i.test(q)) {
                const shop = getCurrentShop();
                if (!shop) return "🏪 I couldn't find your shop details.";
                return `🏪 **${shop.name}**\n👤 Owner: ${shop.ownerName}\n📞 Contact: ${shop.adminContact}`;
            }

            if (q.includes('supplier') || q.includes('suppliers')) {
                if (q.includes('list') || q.includes('all')) {
                    if (suppliers.length === 0) return "No suppliers registered yet.";
                    return `🏭 **Suppliers** (${suppliers.length})\n${suppliers.map(s => `• ${s.companyName} — ${s.phone} — Balance: ${fmt(s.outstandingBalance || 0)}`).join('\n')}`;
                }
                for (const supplier of suppliers) {
                    if (q.includes(supplier.companyName.toLowerCase().split(' ')[0].toLowerCase())) {
                        const supplierPurchases = purchases.filter(p => p.supplierId === supplier.id);
                        return `🏭 **${supplier.companyName}**\n📞 ${supplier.phone}\n📧 ${supplier.email || 'N/A'}\n📍 ${supplier.address || 'N/A'}\n💰 Balance: ${fmt(supplier.outstandingBalance || 0)}\n📦 ${supplierPurchases.length} purchase orders`;
                    }
                }
                return `🏭 ${suppliers.length} suppliers registered. Ask "List all suppliers" to see them.`;
            }

            if (q.includes('expense') || q.includes('expenses')) {
                const totalExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);
                const today = new Date().toISOString().split('T')[0];
                const todayExpenses = expenses.filter(e => e.date && e.date.startsWith(today));
                const todayTotal = todayExpenses.reduce((sum, e) => sum + e.amount, 0);
                return `💵 **Expenses**\n• Today: ${fmt(todayTotal)}\n• All-time: ${fmt(totalExpenses)}\n• ${expenses.length} total expense entries\n\n${expenses.length > 0 ? expenses.slice(0, 5).map(e => `• ${e.category}: ${fmt(e.amount)}`).join('\n') : 'No expenses recorded.'}`;
            }

            if (q.includes('profit') || q.includes('net profit')) {
                const totalRevenue = sales.reduce((sum, s) => sum + s.total, 0);
                const totalExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);
                const profit = totalRevenue - totalExpenses;
                return `📈 **Profit Report**\n• Revenue: ${fmt(totalRevenue)}\n• Expenses: ${fmt(totalExpenses)}\n• Net Profit: ${fmt(profit)}\n• ${profit >= 0 ? '✅ Profitable' : '⚠️ Operating at a loss'}`;
            }

            if (q.includes('business report') || q.includes('full report')) {
                const totalRevenue = sales.reduce((sum, s) => sum + s.total, 0);
                const totalExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);
                const profit = totalRevenue - totalExpenses;
                const lowStock = products.filter(p => p.stock <= p.reorder);
                const today = new Date().toISOString().split('T')[0];
                const todayRevenue = sales.filter(s => s.date && s.date.startsWith(today)).reduce((sum, s) => sum + s
                    .total, 0);
                return `📊 **Business Report**\n\n💰 **Revenue**\n• All-time: ${fmt(totalRevenue)}\n• Today: ${fmt(todayRevenue)}\n\n💵 **Expenses**\n• All-time: ${fmt(totalExpenses)}\n• Net Profit: ${fmt(profit)}\n\n📦 **Inventory**\n• ${products.length} products\n• ${lowStock.length} need reordering\n• Value: ${fmt(products.reduce((s, p) => s + p.price * p.stock, 0))}\n\n👥 **Clients**\n• ${clients.length} registered\n• ${suppliers.length} suppliers\n\n📊 **Sales**\n• ${sales.length} transactions`;
            }

            return `🤔 I'm not sure about that. Try asking:\n\n📦 "How many products do we have?"\n💰 "What's the price of cement?"\n📊 "Today's revenue"\n👥 "Who are our top clients?"\n🏭 "List all suppliers"\n📈 "Business report"`;
        }

            return `

                    ` : `

                        <div class="field"><label>Set Password</label><input type="password" id="regPass" placeholder="Minimum 4 characters"></div>
                        <p class="auth-error">${authError}</p>
                        <button class="btn btn-black btn-block" id="registerBtn">Register Shop</button>
                        <p class="auth-hint">This creates your shop account and signs you straight in as the owner.</p>
                    `}
                    ${renderSocialLinks()}
                </div>
            </div>`;
        }

        function bindAuth() {
            document.querySelectorAll('.auth-toggle button').forEach(btn => {
                btn.onclick = () => { authMode = btn.dataset.mode;
                    authError = '';
                    render(); };
            });
            if (authMode === 'register') {
                document.getElementById('regAvatarPick').onclick = () => document.getElementById('regAvatarFile').click();
                document.getElementById('regAvatarFile').onchange = e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = () => {
                        pendingAvatar = reader.result;
                        document.getElementById('regAvatarPreview').innerHTML = `<img src="${pendingAvatar}">`;
                    };
                    reader.readAsDataURL(file);
                };
            }
            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn) {
                loginBtn.onclick = () => {
                    const shopName = document.getElementById('loginShop').value.trim();
                    const username = document.getElementById('loginUser').value.trim();
                    const password = document.getElementById('loginPass').value;
                    if (!shopName || !username || !password) { authError = 'Please fill in all fields';
                        render(); return; }
                    const result = login(shopName, username, password);
                    if (result.success) {
                        authError = '';
                        activeTab = result.isSuperAdmin ? 'dev_overview' : 'dashboard';
                        render();
                        toast('Welcome back, ' + result.session.name + '!');
                    } else {
                        authError = result.error || 'Login failed';
                        render();
                    }
                };
                document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn
                        .click(); });
            }
            const regBtn = document.getElementById('registerBtn');
            if (regBtn) {
                regBtn.onclick = () => {
                    const shopName = document.getElementById('regShop').value.trim();
                    const ownerName = document.getElementById('regOwner').value.trim();
                    const adminContact = document.getElementById('regContact').value.trim();
                    const username = document.getElementById('regUsername').value.trim();
                    const password = document.getElementById('regPass').value;
                    if (!shopName || !ownerName || !adminContact || !username || !password) { authError =
                            'Please fill in all fields';
                        render(); return; }
                    if (password.length < 4) { authError = 'Password must be at least 4 characters';
                        render(); return; }
                    const result = registerShop({ shopName, ownerName, adminContact, username, password,
                    avatar: pendingAvatar });
                    if (result.success) {
                        authError = '';
                        const sessionData = { userId: result.user.id, shopId: result.shop.id,
                            username: result.user.name, role: 'owner', isSuperAdmin: false,
                            name: result.user.name, permissions: ['all'] };
                        setSession(sessionData);
                        pendingAvatar = null;
                        activeTab = 'dashboard';
                        render();
                        toast(`Shop registered! You're signed in as ${result.user.name}. Username: ${username}`);
                    } else {
                        authError = result.error || 'Registration failed';
                        render();
                    }
                };
            }
        }

        function DevAnalyticsView() {
            const allShops = state.shops;

            const sorted = Object.entries(shopRevenue).sort((a, b) => b[1] - a[1]);

        function switchToShop(shopId) {
            if (!isSuperAdmin()) return;
            const s = getSession();
            s.viewingShopId = shopId;
            s.isViewingShop = true;
            setSession(s);
            activeTab = 'dashboard';
            render();
            toast('Now viewing: ' + getShopName(shopId));
        }

        function exitShopView() {
            if (!isSuperAdmin()) return;
            const s = getSession();
            s.viewingShopId = null;
            s.isViewingShop = false;
            setSession(s);
            activeTab = 'dev_overview';
            render();
            toast('Back to Developer Hub');
        }

        function resetShop(shopId) {
            if (!isSuperAdmin()) return;
            if (!confirm('Are you sure you want to reset ALL data for this shop?')) return;
            const shop = state.shops.find(s => s.id === shopId);
            if (!shop) return;
            state.products = state.products.filter(p => p.shopId !== shopId);
            state.clients = state.clients.filter(c => c.shopId !== shopId);
            state.sales = state.sales.filter(s => s.shopId !== shopId);
            state.suppliers = state.suppliers.filter(s => s.shopId !== shopId);
            state.purchases = state.purchases.filter(p => p.shopId !== shopId);
            state.expenses = state.expenses.filter(e => e.shopId !== shopId);
            state.employees = state.employees.filter(e => e.shopId !== shopId);
            state.users = state.users.filter(u => u.shopId !== shopId || u.role === 'super_admin');
            persist();
            toast('Shop data reset: ' + shop.name);
            render();
        }

        function addPayment() {
            const shop = prompt('Enter shop ID to add payment:');
            if (!shop) return;
            const amount = prompt('Enter payment amount:');
            if (!amount) return;
            const plan = prompt('Enter plan (Monthly/Quarterly/Yearly):') || 'Monthly';
            const payment = { id: genId(), shopId: shop, amount: parseFloat(amount), plan, status: 'active',
                date: Date.now(), expiry: Date.now() + 30 * 86400000 };
            if (!state.payments) state.payments = [];
            state.payments.push(payment);
            persist();
            toast('Payment added for ' + getShopName(shop));
            render();
        }

        function clearLogs() {
            if (!confirm('Clear all activity logs?')) return;
            state.activityLogs = [];
            persist();
            toast('Logs cleared');
            render();
        }

        function exportAllData() {
            const data = { shops: state.shops, users: state.users, products: state.products, sales: state.sales,
                clients: state.clients, suppliers: state.suppliers, expenses: state.expenses, payments: state
                    .payments };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'rork-power-all-data.json';
            a.click();
            toast('Data exported successfully!');
        }

                    if (confirm('Delete this category?')) {

                        closeModal();
                        render();
                    }
                };

        function openPurchaseModal() {
            const suppliers = SUPPLIERS.getAll();
            const html = `
                <h3>New Purchase Order</h3>
                <div class="field"><label>Supplier <span class="field-required">*</span></label>
                    <select id="pSupplier">${suppliers.map(s => `<option value="${s.id}">${s.companyName}</option>`).join('')}

                </div>
                <div class="field"><label>Date</label><input id="pDate" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
                <div class="field"><label>Items (Format: Product, Qty, Cost, Sell per unit)</label>
                    <textarea id="pItems" rows="4" placeholder="e.g. Cement, 10, 30000, 38000&#10;Iron Sheets, 5, 55000, 65000"></textarea>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-outline" id="cancelModal">Cancel</button>
                    <button class="btn btn-black" id="savePurchase">Create Purchase</button>
                </div>
            `;
            showModal(html, 'purchaseModal', () => {
                const supplierId = document.getElementById('pSupplier').value;
                if (!supplierId) { toast('Please select a supplier'); return; }
                const date = document.getElementById('pDate').value;
                const itemsText = document.getElementById('pItems').value.trim();
                if (!itemsText) { toast('Please add at least one item'); return; }
                const items = itemsText.split('\n').filter(line => line.trim()).map(line => {
                    const parts = line.split(',').map(p => p.trim());
                    if (parts.length < 4) return null;
                    return { productName: parts[0], quantity: parseFloat(parts[1]) || 0,
                    costPrice: parseFloat(parts[2]) || 0, sellingPrice: parseFloat(parts[3]) || 0,
                        unit: 'pc', category: 'General' };
                }).filter(i => i && i.quantity > 0);
                if (!items.length) { toast('Please add valid items'); return; }
                const result = PURCHASES.create({ supplierId, date, items });
                if (result.success) { toast('Purchase order created: ' + result.data.purchaseNumber);
                    closeModal();
                    render(); } else { toast(result.error || 'Failed to create purchase'); }
            });
        }

                document.getElementById('savePurchase') || document.getElementById('saveExpense') ||
                document.getElementById('saveEmployee');
            if (saveBtn) saveBtn.addEventListener('click', onSave);

                const barcode = prompt('Enter or scan barcode:');
                if (barcode) {
                    const product = INVENTORY.getByBarcode(barcode);
                    if (product) {
                        const existing = cart.find(i => i.productId === product.id);
                        if (existing) existing.qty++;
                        else cart.push({ productId: product.id, name: product.name, price: product.price,
                            qty: 1 });
                        renderPosCart();
                        toast('Added: ' + product.name);
                    } else {
                        toast('Product not found');
                    }
                }
            };

            // Search
            const searchInput = document.getElementById('posSearchInput');
            searchInput.addEventListener('input', () => { posSearch = searchInput.value;
                renderPosPicker(); });
            renderPosPicker();

            // Add items if editing
            if (isEdit && sale.items) {
                sale.items.forEach(item => {
                    cart.push({ productId: item.productId, name: item.name, price: item.price, qty: item
                        .qty });
                });
            }
            renderPosCart();

            // Hold
            document.getElementById('posHold').onclick = () => {
                if (!cart.length) { toast('Cart is empty'); return; }
                completeSale('held');
            };

            // Pending
            document.getElementById('posPending').onclick = () => {
                if (!cart.length) { toast('Cart is empty'); return; }
                completeSale('pending');
            };

            // Print
            document.getElementById('posPrint').onclick = () => {
                if (!cart.length) { toast('Cart is empty'); return; }
                printReceipt();
            };

            // Checkout
            document.getElementById('posCheckout').onclick = () => {
                if (!cart.length) { toast('Cart is empty'); return; }
                completeSale('completed');
            };
        }

        function renderPosPicker() {
            const shopId = getShopId();
            const products = byShop('products', shopId).filter(p => p.name.toLowerCase().includes((posSearch || '')
            .toLowerCase()));
            document.getElementById('posPickWrap').innerHTML = products.map(p => `
                <button class="pick-card" data-pick="${p.id}" ${p.stock <= 0 ? 'disabled style="opacity:.4"' : ''}>
                    ${p.image ? `<img src="${p.image}" class="pi">` : ''}
                    <div class="pn">${p.name}</div>
                    <div class="pp">${fmt(p.price)}</div>
                    <div class="ps">${p.stock} ${p.unit} in stock</div>
                </button>
            `).join('') || '<div class="empty">No products found.</div>';
            document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
                const p = byShop('products', shopId).find(x => x.id === b.dataset.pick);
                if (!p) return;
                const existing = cart.find(i => i.productId === p.id);
                if (existing) existing.qty++;
                else cart.push({ productId: p.id, name: p.name, price: p.price, qty: 1 });
                renderPosCart();
            }));
        }

        function renderPosCart() {
            const wrap = document.getElementById('posCartWrap');
            const total = cart.reduce((s, i) => s + i.qty * i.price, 0);
            wrap.innerHTML = cart.length ? cart.map((i, idx) => `
                <div class="cart-item"><div class="ci-name">${i.name}</div>
                    <input type="number" min="1" value="${i.qty}" data-cartqty="${idx}">
                    <div>${fmt(i.qty * i.price)}</div>
                    <button class="icon-btn" data-cartdel="${idx}">${I('x',14)}</button>
                </div>
            `).join('') : '<div class="empty" style="padding:20px 0">Cart is empty. Tap a product to add it.</div>';
            document.getElementById('posCartTotal').textContent = fmt(total);
            document.getElementById('posCheckout').disabled = !cart.length;
            wrap.querySelectorAll('[data-cartqty]').forEach(inp => inp.addEventListener('change', e => {
                cart[Number(inp.dataset.cartqty)].qty = Math.max(1, Number(e.target.value) || 1);
                renderPosCart();
            }));
            wrap.querySelectorAll('[data-cartdel]').forEach(b => b.addEventListener('click', () => { cart.splice(Number(
                    b.dataset.cartdel), 1);
                renderPosCart(); }));
        }

        function completeSale(status) {
            if (!cart.length) return;
            for (const item of cart) {
                const p = byShop('products', getShopId()).find(x => x.id === item.productId);
                if (!p || (p.stock < item.qty && status === 'completed')) {
                    toast(`Not enough stock for ${item.name}`);
                    return;
                }
            }
            const clientId = document.getElementById('posClient').value;
            const client = findById('clients', clientId);
            const total = cart.reduce((s, i) => s + i.qty * i.price, 0);
            const saleData = {
                clientId,
                items: cart.map(i => ({ productId: i.productId, name: i.name, qty: i.qty, price: i.price })),
                date: now(),
                status: status
            };
            const result = SALES.create(saleData);
            if (result.success) {
                const statusLabel = { completed: 'Completed', pending: 'Pending', held: 'Held' } [status] || 'Completed';
                toast(`Sale ${statusLabel} — ${fmt(total)}`);
                if (status === 'completed') {
                    // Print receipt
                    if (confirm('Print receipt?')) { printReceipt(); }
                }
                cart = [];
                closeModal();
                render();
            } else {
                toast(result.error || 'Sale failed');
            }
        }

        function printReceipt() {
            const total = cart.reduce((s, i) => s + i.qty * i.price, 0);
            const shop = getCurrentShop();
            const client = findById('clients', document.getElementById('posClient').value);
            let itemsHtml = cart.map(i =>
                `<div>${i.name} × ${i.qty} = ${fmt(i.qty * i.price)}</div>`
            ).join('');

            const receiptHtml = `
                <div class="receipt">
                    <h2>${shop ? shop.name : state.storeName}</h2>
                    <div>${shop ? shop.adminContact : ''}</div>
                    <div class="line"></div>
                    <div>Date: ${new Date().toLocaleString()}</div>
                    <div>Client: ${client ? client.name : 'Walk-in'}</div>
                    <div class="line"></div>
                    ${itemsHtml}
                    <div class="line"></div>
                    <div class="total">Total: ${fmt(total)}</div>
                    <div class="line"></div>
                    <div>${state.settings.find(s => s.shopId === getShopId())?.receiptFooter || 'Thank you!'}</div>
                </div>
            `;
            const win = window.open('', '_blank', 'width=400,height=600');
            win.document.write(`
                <html><head><title>Receipt</title>
                <style>body{font-family:monospace;padding:20px;margin:0;} .receipt{max-width:300px;margin:0 auto;}
                .line{border-top:1px dashed #ccc;margin:10px 0;} .total{font-weight:700;font-size:16px;}
</style></head>
<body>${receiptHtml}
<script>
    window.onload = function(){ window.print(); setTimeout(function(){ window.close(); }, 1000); };
<\/script>
</body></html>`);
}

function drawChart() {
    const canvas = document.getElementById('salesChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth,
        h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);
    const days = [];
    const now = new Date();
    for (let i = 6; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        d.setHours(0, 0, 0, 0);
        const next = new Date(d);
        next.setDate(next.getDate() + 1);
        const total = byShop('sales', getShopId()).filter(s => s.date && s.date >= d.toISOString() && s.date < next
            .toISOString()).reduce((a, s) => a + s.total, 0);
        days.push({ label: d.toLocaleDateString('en-GB', { weekday: 'short' }), total });
    }
    const max = Math.max(...days.map(d => d.total), 1);
    const padding = 24,
        barGap = 14;
    const barW = (w - padding * 2 - barGap * (days.length - 1)) / days.length;
    ctx.clearRect(0, 0, w, h);
    days.forEach((d, i) => {
        const bh = Math.max(4, (d.total / max) * (h - 40));
        const x = padding + i * (barW + barGap);
        const y = h - 24 - bh;
        ctx.fillStyle = '#0C0C10';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x, y, barW, bh, 3) : ctx.rect(x, y, barW, bh);
        ctx.fill();
        ctx.fillStyle = '#9CA3AF';
        ctx.font = '10px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(d.label, x + barW / 2, h - 8);
    });
}

    const manifest = {

        ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(blob));
    if ('serviceWorker' in navigator) {
        const swSource = `
            const CACHE = 'rork-power-v5';
            self.addEventListener('install', e => { e.waitUntil(caches.open(CACHE).then(c => c.add(self.registration.scope))); self.skipWaiting(); });
            self.addEventListener('activate', e => self.clients.claim());
            self.addEventListener('fetch', e => {
                e.respondWith(caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
                    const copy = res.clone(); caches.open(CACHE).then(c => c.put(e.request, copy)); return res;
                }).catch(() => cached)));
            });`;
        const swBlob = new Blob([swSource], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }
}

            });
        }
        if (activeTab === 'dev_brand') {
            document.getElementById('appLogoPick').onclick = () => document.getElementById('appLogoFile').click();
            document.getElementById('appLogoFile').onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const data = reader.result;
                    document.getElementById('appLogoPreview').innerHTML = `<img src="${data}">`;
                    document.getElementById('appLogoPreview').dataset.url = data;
                    toast('Logo preview updated. Click Save to apply.');
                };
                reader.readAsDataURL(file);
            };
            document.getElementById('saveBrand').onclick = () => {
                const name = document.getElementById('appNameInput').value.trim();
                if (!name) { toast('App name required'); return; }
                state.storeName = name;
                const newLogo = document.getElementById('appLogoPreview').dataset.url;
                if (newLogo) state.appLogo = newLogo;
                persist();
                toast('Brand settings saved!');
                updateFavicon();
                render();
            };
        }
        if (activeTab === 'dev_social') {
            document.getElementById('saveSocial').onclick = () => {
                state.socialLinks = {
                    whatsapp: document.getElementById('socialWhatsapp').value.trim(),
                    facebook: document.getElementById('socialFacebook').value.trim(),
                    twitter: document.getElementById('socialTwitter').value.trim(),
                    instagram: document.getElementById('socialInstagram').value.trim(),
                    email: document.getElementById('socialEmail').value.trim(),
                    phone: document.getElementById('socialPhone').value.trim()
                };
                persist();
                toast('Social links saved!');
                render();
            };
        }
    }
}

function renderInPlace() {
    document.querySelector('main .view').innerHTML = renderTab();
    bindTab();
}
